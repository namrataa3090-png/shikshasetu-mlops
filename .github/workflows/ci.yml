
name: ShikshaSetu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn matplotlib seaborn pyyaml pytest joblib ucimlrepo

    
      - name: Train model for artifact test
        run: python src/shikshasetu/ml/train.py

      - name: Run tests
        run: pytest -v

    
